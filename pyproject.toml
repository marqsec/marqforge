[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marqforge"
description = "Web security discovery framework"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Marq", email = "marqlinux@gmail.com" }
]
keywords = ["security", "framework", "discovery", "pentest", "modular"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dynamic = ["version"]

dependencies = [
    # "requests >= 2.31.0",
    # "urllib3 >= 2.0.0",
]

[project.urls]
Homepage = "https://github.com"
Repository = "https://github.com"
"Bug Tracker" = "https://github.com/issues"
Documentation = "https://readthedocs.io"

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
